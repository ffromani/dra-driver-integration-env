apiVersion: v1
kind: Pod
metadata:
  name: pod-lowlat-tiny
spec:
  containers:
    - name: workload-container
      image: "quay.io/fromani/ctrreschk:v0.0.8"
      resources:
        limits:
          cpu: "2"
          memory: "4Gi"
        claims:
          - name: "lowlat-resources-tiny"
  resourceClaims:
    - name: "lowlat-resources-tiny"
      resourceClaimTemplateName: "lowlat-tiny" 

